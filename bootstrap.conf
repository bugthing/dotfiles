# Settings read by ./bootstrap. Plain bash; sourced, not executed.

# Stow packages linked into $HOME (per-file links, never whole directories).
STOW_PACKAGES=(bash git vim tmux ruby containers)

# Syncthing folder labels to wait for. Pairing is done by scanning a QR code,
# so no device or folder IDs are stored here. Each lands in
# ~/container-volumes/syncthing/<label>.
SYNC_FOLDERS=(HomeSync PasswordStore)

# Links from synced data into $HOME, as "path under the syncthing volume:path under $HOME".
SYNC_LINKS=(
  "HomeSync/ssh:.ssh"
  "HomeSync/gnupg:.gnupg"
  "HomeSync/scripts:scripts"
  "HomeSync/Pictures:Pictures/HomeSync"
  "HomeSync/Documents:Documents/HomeSync"
  "HomeSync/Notes:Notes"
  "PasswordStore:.password-store"
)
